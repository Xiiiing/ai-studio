<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>短剧工作室 · 本地制作</title><style>
:root{color-scheme:dark;--bg:#101618;--panel:#182225;--muted:#98aeaf;--line:#304144;--gold:#e3bd78;--mint:#79c7bb}*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,-apple-system,"Noto Sans CJK SC",sans-serif;background:var(--bg);color:#edf3f1}header{border-bottom:1px solid var(--line);padding:24px 5vw;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:18px;letter-spacing:.08em}.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.2em}main{max-width:1540px;margin:auto;padding:34px 5vw}h1{font-size:42px;font-weight:500;margin:5px 0 12px;letter-spacing:.05em}h2{font-weight:500;font-size:21px;margin:0}p{margin:9px 0}.muted{color:var(--muted)}.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:36px;padding-bottom:30px}.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--gold)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-self:center}.stat{border:1px solid var(--line);border-radius:8px;padding:20px 15px}.stat b{font-size:26px;font-weight:500;display:block;color:var(--mint)}.stat span{font-size:12px;color:var(--muted)}select,input,button{font:inherit;color:inherit;background:#1b292d;border:1px solid #3a5156;border-radius:5px;padding:8px 12px}button{cursor:pointer}button:hover{border-color:var(--gold)}button:disabled{opacity:.4;cursor:wait}.primary{background:var(--gold);border-color:var(--gold);color:#192124}.tools{display:flex;align-items:end;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 0;margin-bottom:30px}.tools label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}.tools input{width:145px}.heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:24px 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}.shot{background:var(--panel);border:1px solid var(--line);border-radius:7px;overflow:hidden}.shot img{width:100%;aspect-ratio:9/16;object-fit:cover;display:block;cursor:pointer}.empty{aspect-ratio:9/16;display:grid;place-content:center;color:var(--muted);background:#1a2325}.shot .caption{padding:12px}.shot .line{font-size:12px;color:#c3d1cf;height:59px;overflow:auto;margin-top:8px}.shot .top{display:flex;justify-content:space-between;align-items:center}.pill{font-size:10px;border:1px solid #42665f;border-radius:15px;padding:1px 6px;color:var(--mint)}.shot label{cursor:pointer}.downloads{display:flex;gap:10px;flex-wrap:wrap}.downloads a{color:var(--gold);border:1px solid var(--line);border-radius:5px;padding:10px 14px;text-decoration:none;font-size:13px}.jobs{display:grid;gap:12px}.job{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}.job summary{cursor:pointer;display:flex;justify-content:space-between}.job pre{overflow:auto;font:12px/1.6 ui-monospace,monospace;max-height:200px;color:#b9cdca;white-space:pre-wrap}#notice{color:var(--gold);min-height:24px;margin:10px 0}footer{padding:32px 0;color:var(--muted);font-size:12px;border-top:1px solid var(--line);margin-top:35px}dialog{border:1px solid var(--line);background:var(--bg);color:white;border-radius:8px;max-width:90vw;padding:15px}dialog::backdrop{background:#000c}dialog video,dialog img{max-height:80vh;max-width:82vw;display:block}dialog button{position:absolute;top:20px;right:20px;z-index:2}a{color:var(--mint)}@media(max-width:800px){.hero{grid-template-columns:1fr}h1{font-size:32px}.stats{gap:7px}.stat{padding:12px}.grid{grid-template-columns:repeat(2,1fr)}header{align-items:start}.tools{gap:8px}}
.finalcut{display:grid;grid-template-columns:280px 1fr;gap:32px;align-items:center;padding:24px;background:#182225;border:1px solid #42665f;border-radius:8px;margin:0 0 32px}.finalcut[hidden]{display:none}.finalcut video{width:100%;max-height:520px;border-radius:5px;background:#000}.finalcut a{display:inline-block;margin-top:16px;color:#192124;background:var(--gold);padding:10px 16px;border-radius:5px;text-decoration:none}@media(max-width:700px){.finalcut{grid-template-columns:1fr}.finalcut video{max-width:300px;margin:auto}}</style><header><div class="brand">短剧工作室<small>LOCAL FILM PRODUCTION</small></div><select id="episodes" aria-label="选择剧集"></select></header><main><section class="hero"><div><div class="eyebrow">STORY / FRAME / MOTION / VOICE</div><h1 id="title">正在读取制作项目</h1><p id="logline" class="muted"></p></div><div class="stats"><div class="stat"><b id="duration">—</b><span>成片时长 / 秒</span></div><div class="stat"><b id="frames">—</b><span>分镜图已就绪</span></div><div class="stat"><b id="videos">—</b><span>动态镜头已就绪</span></div></div></section>
<section id="finalcut" class="finalcut" hidden></section><div class="tools"><label>制作阶段<select id="stage"><option value="images">生成分镜图</option><option value="video">生成动态镜头</option><option value="voice">生成角色对白</option><option value="mix">混音与字幕</option><option value="lipsync">生成口型候选</option><option value="assemble">合成成片</option><option value="verify">技术检查</option></select></label><label>显卡编号<input id="gpus" value="1,2" aria-label="显卡编号"></label><label>视频配置<select id="profile"><option value="quality">标准质量 · 20步</option><option value="fastwan">FastWan · 3步</option></select></label><label>新版本名称<input id="take" placeholder="留空自动命名"></label><button class="primary" id="start">运行选定阶段</button><button id="refresh">刷新</button></div><div id="notice"></div>
<div class="heading"><h2>分镜与镜头</h2><span class="muted" id="selected">未勾选时处理全部镜头</span></div><p class="muted" style="font-size:12px">点击画面预览已选视频；尚无视频时显示分镜图。口型阶段保留候选，检查后可在命令行使用 --adopt 选入成片。</p><section class="grid" id="shots"></section>
<div class="heading"><h2>成片与制作资料</h2><a id="definition" target="_blank">剧集配置</a></div><section class="downloads" id="downloads"></section>
<div class="heading"><h2>工作台任务</h2><span class="muted" style="font-size:12px">只列出在此页面启动的任务</span></div><section id="jobs" class="jobs"></section>
<footer>所有生成任务在本机执行。角色、模型版本、镜头素材和声音均保留制作记录。1080 × 1920 交付版来自原生 720p 画面的后期重采样。</footer></main><dialog id="viewer"><button onclick="document.getElementById('viewer').close()">关闭</button><div id="viewbody"></div></dialog>
<script>
let current=null;const boot=JSON.parse(document.getElementById("boot-data")?.textContent||"null");const el=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const media=p=>'/media/'+p.split('/').map(encodeURIComponent).join('/');
async function json(url,options){const r=await fetch(url,options);const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
async function load(){const slug=el('episodes').value;if(!slug)return;const picked=[...document.querySelectorAll('.pick:checked')].map(x=>x.value);current=boot?.episode?.slug===slug?boot.episode:await json('/api/episode/'+encodeURIComponent(slug));if(boot)boot.episode=null;el('title').textContent=current.title;el('logline').textContent=current.logline;el('duration').textContent=current.duration;el('frames').textContent=current.shots.filter(x=>x.image).length+' / '+current.shots.length;el('videos').textContent=current.shots.filter(x=>x.video).length+' / '+current.shots.length;el('definition').href=media(current.definition);
const film=current.files.find(x=>x.name.endsWith('_1080p_zh.mp4'));const cover=current.files.find(x=>x.name==='cover.jpg');el('finalcut').hidden=!film;el('finalcut').innerHTML=film?'<video controls playsinline preload="metadata" '+(cover?'poster="'+media(cover.path)+'"':'')+' src="'+media(film.path)+'"></video><div><div class="eyebrow">COMPLETED FILM</div><h2>完整成片 · '+esc(current.title)+'</h2><p class="muted">'+current.duration+' 秒 · '+current.shots.length+' 个动态镜头 · 中文字幕版</p><p>画面、对白、配乐和字幕已合成，媒体技术检查通过。可直接播放，或下载保存。</p><a download href="'+media(film.path)+'">下载中文字幕版</a></div>':'';
el('shots').innerHTML=current.shots.map(s=>'<article class="shot">'+(s.image?'<img loading="eager" data-shot="'+esc(s.id)+'" src="'+media(s.image.path)+'" alt="'+esc(s.id)+' 分镜">':'<div class="empty">等待画面</div>')+'<div class="caption"><div class="top"><label><input class="pick" type="checkbox" value="'+esc(s.id)+'" '+(picked.includes(s.id)?'checked':'')+'> '+esc(s.id)+'</label><span class="pill">'+(s.video?'视频就绪':'分镜')+'</span></div><div class="line">'+s.dialogue.map(d=>esc(d.text)).join('<br>')+'</div></div></article>').join('');
document.querySelectorAll('[data-shot]').forEach(x=>x.onclick=()=>preview(x.dataset.shot));document.querySelectorAll('.pick').forEach(x=>x.onchange=()=>el('selected').textContent='已选择 '+document.querySelectorAll('.pick:checked').length+' 个镜头');
el('downloads').innerHTML=current.files.length?current.files.map(f=>'<a href="'+media(f.path)+'" target="_blank">'+esc(f.name)+' · '+(f.bytes/1024/1024).toFixed(1)+' MB</a>').join(''):'<p class="muted">完成混音或合成后，文件将出现在这里。</p>';
await loadJobs()}
function preview(id){const s=current.shots.find(x=>x.id===id);el('viewbody').innerHTML=s.video?'<video controls autoplay playsinline src="'+media(s.video.path)+'"></video>':'<img src="'+media(s.image.path)+'">';el('viewer').showModal()}
el('viewer').addEventListener('close',()=>el('viewbody').innerHTML='');
async function loadJobs(){const jobs=await json('/api/jobs');el('jobs').innerHTML=jobs.length?jobs.map(j=>'<details class="job" '+(j.state==='running'?'open':'')+'><summary><span>'+esc(j.stage)+' · '+esc(j.episode)+' · '+esc(j.take)+'</span><span class="pill">'+esc({running:'运行中',completed:'已完成',failed:'需检查'}[j.state]||j.state)+'</span></summary><pre>'+esc(j.tail||'正在启动…')+'</pre></details>').join(''):'<p class="muted">尚无工作台任务。通过终端启动的制作任务也会更新上方素材状态。</p>'}
el('start').onclick=async()=>{el('start').disabled=true;try{const shots=[...document.querySelectorAll('.pick:checked')].map(x=>x.value);const r=await json('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({episode:el('episodes').value,stage:el('stage').value,gpus:el('gpus').value,profile:el('profile').value,take:el('take').value,shots})});el('notice').textContent='任务已启动：'+r.id;await loadJobs()}catch(e){el('notice').textContent=e.message}finally{el('start').disabled=false}};
el('refresh').onclick=()=>load().catch(e=>el('notice').textContent=e.message);el('episodes').onchange=()=>load().catch(e=>el('notice').textContent=e.message);el('stage').onchange=()=>{if(el('stage').value==='video')el('gpus').value='1,2,3,4';if(el('stage').value==='images')el('gpus').value='1,2'};
(async()=>{try{const episodes=boot?.episodes||await json('/api/episodes');el('episodes').innerHTML=episodes.map(x=>'<option value="'+esc(x.slug)+'">'+esc(x.title)+'</option>').join('');if(episodes.some(x=>x.slug==='the-last-stop'))el('episodes').value='the-last-stop';await load();setInterval(()=>loadJobs().catch(()=>{}),7000)}catch(e){el('notice').textContent=e.message}})();
</script></html>
