<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#101b2b">
  <title>映序 · AI 制片工作室</title>
  <link rel="stylesheet" href="/factory/static/styles.css">
  <link rel="stylesheet" href="/factory/static/cloud-budget.css">
  <link rel="stylesheet" href="/factory/static/series.css">
  <link rel="stylesheet" href="/factory/static/shot-workbench.css">
  <link rel="stylesheet" href="/factory/static/console.css">
</head>
<body>
  <a class="skip-link" href="#workspace">跳至工作区</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="工作区导航">
      <a class="brand" href="/" aria-label="映序首页"><span class="brand-mark" aria-hidden="true"><svg width="25" height="25" viewBox="0 0 28 28" fill="none"><path d="M4 4h8v8H4zm12 0h8v8h-8zM4 16h8v8H4zm12 0 8 4-8 4z" fill="currentColor"/></svg></span><span>映序<small>AI PRODUCTION STUDIO</small></span></a>
      <button class="button primary new-project" data-action="new-project"><span aria-hidden="true">＋</span> 新建制作</button>
      <div class="sidebar-section-label">工作室</div>
      <nav class="main-nav">
        <button class="nav-item active" data-action="dashboard" data-view="dashboard"><span class="nav-icon">▦</span>制片总览</button>
        <button class="nav-item" data-action="view" data-view="projects"><span class="nav-icon">▤</span>全部项目</button>
        <button class="nav-item" data-action="view" data-view="inbox"><span class="nav-icon">▣</span>待办决策<span id="decision-count" class="nav-count">0</span></button>
        <button class="nav-item" data-action="view" data-view="workflow"><span class="nav-icon">◇</span>工作流与分工</button>
        <button class="nav-item" data-action="models" data-view="models"><span class="nav-icon">⊞</span>模型与连接</button>
        <button class="nav-item" data-action="view" data-view="activity"><span class="nav-icon">≡</span>运行记录</button>
      </nav>
      <div class="sidebar-heading"><span>最近项目</span><span id="project-count">—</span></div>
      <div id="project-list" class="project-list"><p class="sidebar-empty">正在读取项目…</p></div>
      <div class="sidebar-bottom"><button class="health-link" data-action="capabilities"><span id="engine-dot" class="dot"></span><span>运行环境<small id="engine-label">正在检查资源</small></span><span>↗</span></button><span class="workspace-label">本地制片 · 版本与证据可追溯</span></div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><div class="topbar-context"><button class="icon-button mobile-navigation" data-action="toggle-navigation" aria-label="展开导航">☰</button><div class="breadcrumb">工作室 <span>/</span> <strong id="breadcrumb">制片总览</strong></div></div><div class="topbar-right"><span id="sync-state" class="sync-state">连接中</span><button class="icon-button" data-action="refresh" title="刷新状态" aria-label="刷新项目">↻</button><div class="producer-avatar" aria-label="出品人">出</div></div></header>
      <main id="workspace" tabindex="-1"><section class="loading-panel"><div class="loader"></div><h1>正在连接制片工作室</h1><p>读取项目、待办与执行状态。</p></section></main>
      <footer class="workspace-footer"><span>映序 AI 制片工作室</span><span>创作 · 制作 · 审核 · 交付</span></footer>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="project-dialog" class="project-dialog" aria-label="制作项目设置"></dialog>
  <dialog id="capabilities-dialog" class="capabilities-dialog" aria-labelledby="capabilities-title"></dialog>
  <dialog id="preview-dialog" class="preview-dialog" aria-label="镜头预览"></dialog>
  <dialog id="model-dialog" class="model-dialog" aria-labelledby="model-editor-title"></dialog>
  <script type="module" src="/factory/static/app.js"></script>
</body>
</html>
