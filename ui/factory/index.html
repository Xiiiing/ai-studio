<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f3ee">
  <title>映序 AI Studio · 多模型创作工作流</title>
  <link rel="stylesheet" href="/factory/static/styles.css">
  <link rel="stylesheet" href="/factory/static/cloud-budget.css">
  <link rel="stylesheet" href="/factory/static/series.css">
  <link rel="stylesheet" href="/factory/static/shot-workbench.css">
  <link rel="stylesheet" href="/factory/static/team-cockpit.css">
</head>
<body>
  <a class="skip-link" href="#workspace">跳至工作区</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="工作区导航">
      <a class="brand" href="/" aria-label="映序首页"><span class="brand-mark" aria-hidden="true">映</span><span>映序<small>AI STUDIO</small></span></a>
      <button class="button primary new-project" data-action="new-project"><span aria-hidden="true">＋</span> 发起新制作</button>
      <nav class="main-nav">
        <button class="nav-item active" data-action="dashboard"><span class="nav-icon" aria-hidden="true">▦</span>工作流与项目<span id="decision-count" class="nav-count">0</span></button>
        <button class="nav-item" data-action="models"><span class="nav-icon" aria-hidden="true">⊞</span>模型与连接</button>
        <a class="nav-item" href="/legacy"><span class="nav-icon" aria-hidden="true">▤</span>原有作品与工具<span class="external" aria-hidden="true">↗</span></a>
      </nav>
      <div class="sidebar-heading"><span>制作项目</span><span id="project-count">—</span></div>
      <div id="project-list" class="project-list"><p class="sidebar-empty">正在读取项目…</p></div>
      <div class="sidebar-bottom">
        <button class="health-link" data-action="capabilities"><span id="engine-dot" class="dot"></span><span>制作能力与资源<small id="engine-label">正在连接服务</small></span><span aria-hidden="true">↗</span></button>
        <span class="workspace-label">MODEL-POWERED WORKFLOW</span>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><div class="breadcrumb">制片工作室 <span>/</span> <strong id="breadcrumb">工作流与项目</strong></div><div class="topbar-right"><span id="sync-state" class="sync-state">连接中</span><button class="icon-button" data-action="refresh" title="刷新项目" aria-label="刷新项目">↻</button><div class="producer-avatar" aria-label="出品人">出</div></div></header>
      <main id="workspace" tabindex="-1"><section class="loading-panel"><div class="loader"></div><h1>正在连接制片工作室</h1><p>读取制作项目、待决策事项和可用资源。</p></section></main>
      <footer class="workspace-footer"><span>映序 · 从故事到成片</span><span>选故事 / 定视觉 / 审成片</span></footer>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="project-dialog" class="project-dialog" aria-labelledby="create-title"></dialog>
  <dialog id="capabilities-dialog" class="capabilities-dialog" aria-labelledby="capabilities-title"></dialog>
  <dialog id="preview-dialog" class="preview-dialog" aria-label="镜头预览"></dialog>
  <dialog id="model-dialog" class="model-dialog" aria-labelledby="model-editor-title"></dialog>
  <script type="module" src="/factory/static/app.js"></script>
</body>
</html>
