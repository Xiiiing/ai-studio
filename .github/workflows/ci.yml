name: Workflow contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpu-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install control dependencies
        run: python -m pip install -r requirements-factory.txt
      - name: Verify workflow and provider contracts
        run: python -m pytest -q tests/test_factory_*.py
      - name: Verify producer UI
        run: node --test tests/test_factory_ui.mjs
