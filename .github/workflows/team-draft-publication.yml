name: Publish verified team draft branches

on:
  push:
    branches: [chore/team-draft-publication-20261015]
    paths: [.publication/READY]

permissions:
  contents: read

jobs:
  publish-exact-trees:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      final_head: ${{ steps.publish.outputs.final_head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify patches and publish only the three new feature branches
        id: publish
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, re, subprocess, tempfile
          root = pathlib.Path.cwd()
          base = '81193b04993c775ae9cc7ab23f4bd2cce30a4895'
          allowed = ['feat/team-executive-producer', 'feat/delivery-readiness', 'feat/team-command-center']
          def git(*args, cwd=root):
              return subprocess.check_output(['git', *args], cwd=cwd, text=True).strip()
          manifest = json.loads((root / '.publication/manifest.json').read_text())
          assert manifest['base'] == base
          entries = manifest['branches']
          assert len(entries) == 3 and [e['branch'] for e in entries] == allowed
          planned = []
          for i, entry in enumerate(entries):
              assert re.fullmatch(r'[0-9a-f]{40}', entry['tree'])
              assert entry['patch'] in {'producer.patch', 'delivery.patch', 'cockpit.patch'}
              parent = planned[-1]['head'] if planned else base
              target = pathlib.Path(tempfile.mkdtemp(prefix='team-draft-')) / 'checkout'
              git('worktree', 'add', '--detach', str(target), parent)
              git('apply', '--index', str(root / '.publication' / entry['patch']), cwd=target)
              paths = git('diff', '--cached', '--name-only', cwd=target).splitlines()
              assert sorted(paths) == sorted(entry['paths'])
              assert all(p.startswith(('factory/', 'ui/', 'tests/', 'docs/')) for p in paths)
              actual = git('write-tree', cwd=target)
              assert actual == entry['tree'], (entry['branch'], actual, entry['tree'])
              git('-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com',
                  '-c', 'core.hooksPath=/dev/null', 'commit', '-m', entry['message'], cwd=target)
              sha = git('rev-parse', 'HEAD', cwd=target)
              remote = git('ls-remote', '--heads', 'origin', 'refs/heads/' + entry['branch'])
              if remote:
                  existing = remote.split()[0]
                  git('fetch', 'origin', existing)
                  assert git('rev-parse', existing + '^{tree}') == actual, 'Existing branch differs; refusing overwrite'
                  planned.append({**entry, 'head': existing, 'push': False})
              else:
                  planned.append({**entry, 'head': sha, 'push': True})
          refspecs = [e['head'] + ':refs/heads/' + e['branch'] for e in planned if e['push']]
          if refspecs:
              git('push', '--atomic', 'origin', *refspecs)
          receipt = {'base': base, 'branches': [{k:e[k] for k in ('branch','tree','head')} for e in planned],
                     'deployment': False, 'main_modified': False, 'model_requests': 0}
          (root / '.publication/receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('final_head=' + planned[-1]['head'] + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: team-draft-publication-receipt
          path: .publication/receipt.json
          if-no-files-found: error
  combined-linux-validation:
    needs: publish-exact-trees
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish-exact-trees.outputs.final_head }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-factory.txt -r requirements-evaluation.txt
      - run: python -m pytest -q tests/test_factory_*.py --junitxml=runtime/team-python.xml
      - run: npm ci --ignore-scripts
      - run: node --test tests/test_factory*.mjs
      - run: python scripts/browser_fixtures.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-combined-linux-evidence
          path: |
            runtime/team-python.xml
            runtime/browser-report/
          if-no-files-found: error
